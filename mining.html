<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mining • South Africa Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(to right, #007A4D, #FFCD00, #002395);">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">🇿🇦 South Africa Dashboard</a>
      <a href="index.html" class="btn btn-light btn-sm">← Back to Dashboard</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h1 class="display-5 fw-bold text-sa-green text-center mb-4">⛏️ South Africa Mining Sector</h1>
    <p class="text-center lead mb-3">World leader in strategic minerals — Click any commodity below</p>
    <p class="text-center mb-4">For a deeper look at downstream processing, smelting and metal manufacturing for these commodities, visit the <a href="manufacturing.html">Manufacturing &amp; Smelting</a> page.</p>

    <div class="row g-4" id="mining-grid"></div>
  </div>

  <script>
    const commodities = [
      { name: "Platinum Group Metals", file: "pgms.html", icon: "💎" },
      { name: "Coal", file: "coal.html", icon: "⚫" },
      { name: "Manganese", file: "manganese.html", icon: "🔋" },
      { name: "Gold", file: "gold.html", icon: "🏅" },
      { name: "Chrome", file: "chrome.html", icon: "🟢" },
      { name: "Iron Ore", file: "ironore.html", icon: "🪨" },
      { name: "Diamonds", file: "diamonds.html", icon: "💎" },
      { name: "Vanadium", file: "vanadium.html", icon: "⚡" }
    ];

    function renderGrid() {
      const grid = document.getElementById('mining-grid');
      grid.innerHTML = commodities.map(c => `
        <div class="col-md-6 col-lg-4">
          <a href="${c.file}" class="text-decoration-none">
            <div class="card h-100 shadow-sm hover-effect">
              <div class="card-body text-center py-5">
                <h1 class="display-1 mb-3">${c.icon}</h1>
                <h5 class="card-title text-sa-green">${c.name}</h5>
                <small class="text-muted">Click to explore →</small>
              </div>
            </div>
          </a>
        </div>
      `).join('');
    }

    window.onload = renderGrid;
  </script>

  <style>
    .hover-effect:hover { transform: scale(1.05); transition: 0.3s; }
  </style>
</body>
</html>
