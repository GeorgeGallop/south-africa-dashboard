<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post-Apartheid Presidents • South Africa Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(to right, #007A4D, #FFCD00, #002395);">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">🇿🇦 South Africa Dashboard</a>
      <div class="d-flex gap-2">
        <button onclick="history.back()" class="btn btn-light btn-sm">← Back</button>
        <a href="index.html" class="btn btn-light btn-sm">🏠 Home</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h1 class="display-5 fw-bold text-sa-green text-center mb-4">📜 Post-Apartheid Presidents of South Africa</h1>
    <p class="text-center lead mb-5">Since the end of apartheid in 1994</p>

    <div class="row g-4" id="presidents-grid"></div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="presidentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-sa-green text-white">
          <h5 class="modal-title" id="modalName"></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-4 text-center">
              <img id="modalPhoto" class="img-fluid rounded shadow" style="max-height: 420px; object-fit: cover;" alt="">
            </div>
            <div class="col-md-8" id="modalContent"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const presidents = [
      {
        name: "Nelson Mandela",
        term: "1994 – 1999",
        photo: "images/presidents/presidents_nelson_mandela.jpg",
        para1: "Nelson Rolihlahla Mandela was South Africa’s first democratically elected president after apartheid. He spent 27 years incarcerated on Robben Island and in other prisons, and his release in 1990 set the stage for the negotiated transition from apartheid to majority rule.",
        para2: "As president he led national reconciliation through the Truth and Reconciliation Commission, adopted the 1996 Constitution, and established policies like the Reconstruction and Development Programme (RDP) to expand housing, electrification, and social services. Mandela maintained a firm commitment to one term in office, believing that democratic institutions should outlast any individual leader.",
        para3: "His presidency is remembered for a politics of forgiveness and unity, even as the country faced deep economic inequality and the challenge of transforming apartheid-era institutions. He retired in 1999 after completing his single term and remained a global moral icon until his death in 2013.",
        sources: "<a href=\"https://www.mandela.gov.za\" target=\"_blank\">Mandela Foundation</a>, <a href=\"https://www.constitutionhill.org.za\" target=\"_blank\">South African Constitution</a>, <a href=\"https://www.truth-commission.org.za\" target=\"_blank\">Truth and Reconciliation Commission</a>"
      },
      {
        name: "Thabo Mbeki",
        term: "1999 – 2008",
        photo: "images/presidents/presidents_thabo_mbeki.jpg",
        para1: "Thabo Mbeki succeeded Mandela and championed the concept of the African Renaissance, seeking a more confident and integrated continent. His presidency was marked by a strong focus on macroeconomic stability, private-sector investment, and South Africa’s role in regional diplomacy.",
        para2: "Mbeki pushed policies like the Growth, Employment and Redistribution (GEAR) strategy and expansion of Black Economic Empowerment, but his tenure was also criticised for HIV/AIDS denialism, which delayed access to antiretroviral treatment. He oversaw major events such as the 2002 World Summit on Sustainable Development in Johannesburg and the 2007 African Union summit.",
        para3: "After an increasingly fractious relationship with his party, the ANC recalled him in 2008 following internal disputes and criticism of his leadership style. He left office voluntarily after the recall and later remained a key elder statesman in continental politics.",
        sources: "<a href=\"https://www.sahistory.org.za/people/thabo-mbeki\" target=\"_blank\">South African History Online</a>, <a href=\"https://www.africa-confidential.com\" target=\"_blank\">African Renaissance</a>, <a href=\"https://www.who.int/news-room/fact-sheets/detail/hiv-aids\" target=\"_blank\">HIV/AIDS policy</a>"
      },
      {
        name: "Kgalema Motlanthe",
        term: "2008 – 2009",
        photo: "images/presidents/presidents_kgalema_motlanthe.jpg",
        para1: "Kgalema Motlanthe served as interim president for nine months after Thabo Mbeki was recalled by the ANC. A former trade union leader and ANC deputy president, he was chosen to stabilise the country during a difficult political transition.",
        para2: "His brief presidency focused on restoring credibility to the state, preparing for the 2009 elections, and maintaining calm within an ANC divided by factionalism. Motlanthe avoided major policy shifts, instead emphasising government continuity, good governance, and the rule of law.",
        para3: "After the 2009 election he stepped down in favour of Jacob Zuma and later served as Deputy President until 2014. He remains respected for his quiet integrity and ability to keep the country steady during a fraught handover.",
        sources: "<a href=\"https://www.gov.za/about-government/contact-directory/kgalema-motlanthe\" target=\"_blank\">South African Government</a>, <a href=\"https://www.sahistory.org.za/people/kgalema-motlanthe\" target=\"_blank\">SA History Online</a>"
      },
      {
        name: "Jacob Zuma",
        term: "2009 – 2018",
        photo: "images/presidents/presidents_jacob_zuma.jpg",
        para1: "Jacob Zuma presided over a period of rapid political and economic turbulence. Early in his presidency he expanded social grants, supported infrastructure projects, and promoted a more populist, pro-poor agenda, but his administration became increasingly associated with patronage and state capture.",
        para2: "Zuma’s term saw major scandals including the Nkandla upgrades, the Nkandla judgment by the Constitutional Court, and allegations that the Gupta family influenced ministerial appointments. His government faced repeated protests, judicial inquiries, and mounting criticism over corruption and poor service delivery.",
        para3: "He was forced to resign in 2018 after the ANC lost confidence in his leadership and the party threatened a motion of no confidence. His departure followed a decade of legal battles and the publication of the Zondo Commission report into state capture.",
        sources: "<a href=\"https://www.sahistory.org.za/people/jacob-zuma\" target=\"_blank\">SA History Online</a>, <a href=\"https://www.statecapture.org.za\" target=\"_blank\">Zondo Commission</a>, <a href=\"https://www.constitutionalcourt.org.za\" target=\"_blank\">South African Constitutional Court</a>"
      },
      {
        name: "Cyril Ramaphosa",
        term: "2018 – present",
        photo: "images/presidents/presidents_cyril_ramaphosa.jpg",
        para1: "Cyril Ramaphosa became president promising to fight corruption, strengthen state institutions, and revitalise the economy. A veteran trade unionist and businessman, he led the ANC back into power in 2019 and then again in 2024 in a Government of National Unity.",
        para2: "His presidency has focused on economic recovery, investment, energy security and governance reforms, including electricity market reform and unlocking private-sector participation in generation. Ramaphosa has also had to manage rising unemployment, labor unrest, and the fallout from Zuma-era state capture.",
        para3: "He remains in office while negotiating a broad coalition, and his leadership is judged on whether he can deliver tangible progress on corruption, infrastructure, and a just transition to a cleaner energy future. His continuing challenge is balancing economic growth with the urgent need for energy stability.",
        sources: "<a href=\"https://www.gov.za/about-government/contact-directory/cyril-ramaphosa\" target=\"_blank\">South African Government</a>, <a href=\"https://www.anc1912.org.za\" target=\"_blank\">ANC official page</a>, <a href=\"https://www.dw.com/en/cyril-ramaphosa-profile/a-43163024\" target=\"_blank\">DW profile</a>"
      }
    ];

    function renderPresidents() {
      const grid = document.getElementById('presidents-grid');
      grid.innerHTML = presidents.map((p, i) => `
        <div class="col-md-6 col-lg-4">
          <div class="card h-100 shadow-sm" onclick="showPresident(${i})" style="cursor:pointer;">
            <img src="${p.photo}" class="card-img-top" style="height: 260px; object-fit: cover;" alt="${p.name}">
            <div class="card-body text-center">
              <h5 class="card-title text-sa-green">${p.name}</h5>
              <p class="card-text text-muted">${p.term}</p>
              <button class="btn btn-outline-success btn-sm w-100">View Profile</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    window.showPresident = function(i) {
      const p = presidents[i];
      document.getElementById('modalName').textContent = `${p.name} (${p.term})`;
      document.getElementById('modalPhoto').src = p.photo;
      
      document.getElementById('modalContent').innerHTML = `
        <p>${p.para1}</p>
        <p>${p.para2}</p>
        <p>${p.para3}</p>
        <hr>
        <strong>Source:</strong> ${p.sources}
      `;
      new bootstrap.Modal(document.getElementById('presidentModal')).show();
    };

    window.onload = renderPresidents;
  </script>

  <style>
    .card:hover { transform: scale(1.04); transition: 0.3s; }
  </style>
</body>
</html>
