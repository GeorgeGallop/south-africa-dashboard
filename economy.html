<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Economy • South Africa Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(to right, #007A4D, #FFCD00, #002395);">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">🇿🇦 South Africa Dashboard</a>
      <a href="index.html" class="btn btn-light btn-sm">← Back to Dashboard</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h1 class="display-5 fw-bold text-sa-green">📈 Economy & GDP</h1>
    <p class="lead">USD/ZAR Exchange Rate — Historical Data from Your CSV</p>

    <div class="card shadow-sm mt-4">
      <div class="card-header bg-light">
        <h5 class="mb-0">💱 USD to ZAR Exchange Rate</h5>
      </div>
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div id="current-rate" class="fs-3 fw-bold text-sa-green">Loading data...</div>
          <div class="btn-group currency-btn-group" role="group">
            <button onclick="setTimeframe(30, this)" class="btn btn-outline-success btn-sm">30 Days</button>
            <button onclick="setTimeframe(90, this)" class="btn btn-outline-success btn-sm">3 Months</button>
            <button onclick="setTimeframe(365, this)" class="btn btn-outline-success btn-sm">1 Year</button>
            <button onclick="setTimeframe(9999, this)" class="btn btn-outline-success btn-sm active">All Time</button>
          </div>
        </div>
        
        <canvas id="zarChart" height="160"></canvas>
      </div>
    </div>

    <div class="card shadow-sm mt-4">
      <div class="card-header bg-light">
        <h5 class="mb-0">📊 South Africa GDP (current US$)</h5>
      </div>
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div id="current-gdp" class="fs-3 fw-bold text-sa-green">Loading GDP data...</div>
          <div class="btn-group gdp-btn-group" role="group">
            <button onclick="setGdpTimeframe(10, this)" class="btn btn-outline-success btn-sm">10 Years</button>
            <button onclick="setGdpTimeframe(20, this)" class="btn btn-outline-success btn-sm">20 Years</button>
            <button onclick="setGdpTimeframe(9999, this)" class="btn btn-outline-success btn-sm active">All Time</button>
          </div>
        </div>
        <canvas id="gdpChart" height="160"></canvas>
      </div>
    </div>

    <div class="card shadow-sm mt-4">
      <div class="card-header bg-light">
        <h5 class="mb-0">📈 South Africa Inflation Rate (%)</h5>
      </div>
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <div id="current-inflation" class="fs-3 fw-bold text-sa-green">Loading inflation data...</div>
          <div class="btn-group inflation-btn-group" role="group">
            <button onclick="setInflationTimeframe(10, this)" class="btn btn-outline-success btn-sm">10 Years</button>
            <button onclick="setInflationTimeframe(20, this)" class="btn btn-outline-success btn-sm">20 Years</button>
            <button onclick="setInflationTimeframe(9999, this)" class="btn btn-outline-success btn-sm active">All Time</button>
          </div>
        </div>
        <canvas id="inflationChart" height="160"></canvas>
      </div>
    </div>
  </div>

  <script>
    let zarChart;
    let gdpChart;
    let inflationChart;
    let rateHistory = [];
    let gdpHistory = [];
    let inflationHistory = [];

    async function loadCSVData() {
      await Promise.all([loadRateData(), loadGdpData(), loadInflationData()]);
      renderChart(9999);
      renderGdpChart(9999);
      renderInflationChart(9999);
    }

    async function loadRateData() {
      try {
        const response = await fetch('data/USDZAR2.csv');
        const text = await response.text();
        const parsed = Papa.parse(text, {
          header: true,
          dynamicTyping: true,
          skipEmptyLines: true
        });

        rateHistory = parsed.data
          .filter(row => row.observation_date && row.DEXSFUS)
          .map(row => ({
            time: row.observation_date,
            rate: parseFloat(row.DEXSFUS)
          }))
          .sort((a, b) => new Date(a.time) - new Date(b.time));

        if (rateHistory.length > 0) {
          const latest = rateHistory[rateHistory.length - 1];
          document.getElementById('current-rate').innerHTML =
            `1 USD = <strong>${latest.rate.toFixed(4)}</strong> ZAR`;
        }
      } catch (e) {
        document.getElementById('current-rate').innerHTML =
          `<span class="text-danger">Error loading USDZAR.csv — Check file path and column names</span>`;
        console.error(e);
      }
    }

    async function loadGdpData() {
      try {
        const response = await fetch('data/GDP.csv');
        const text = await response.text();
        const parsed = Papa.parse(text, {
          header: false,
          dynamicTyping: false,
          skipEmptyLines: true
        });

        const rows = parsed.data;
        const headerRow = rows.find(row => row[0] === 'Country Name' && row[1] === 'Country Code');
        const dataRow = rows.find(row => row[0] === 'South Africa' && row[2] === 'GDP (current US$)');

        if (!headerRow || !dataRow) {
          throw new Error('GDP data or header row not found');
        }

        gdpHistory = headerRow
          .map((col, i) => ({ col, index: i }))
          .filter(col => /^[0-9]{4}$/.test(col.col) && dataRow[col.index] != null && dataRow[col.index] !== '')
          .map(col => ({
            time: col.col,
            gdp: parseFloat(dataRow[col.index])
          }))
          .filter(entry => !Number.isNaN(entry.gdp))
          .sort((a, b) => parseInt(a.time, 10) - parseInt(b.time, 10));

        if (gdpHistory.length > 0) {
          const latest = gdpHistory[gdpHistory.length - 1];
          document.getElementById('current-gdp').innerHTML =
            `In ${latest.time}: <strong>$${latest.gdp.toLocaleString(undefined, {maximumFractionDigits: 0})}</strong>`;
        } else {
          document.getElementById('current-gdp').innerHTML =
            `<span class="text-warning">No GDP rows found in GDP.csv</span>`;
        }
      } catch (e) {
        document.getElementById('current-gdp').innerHTML =
          `<span class="text-danger">Error loading GDP.csv — Check file path and data format</span>`;
        console.error(e);
      }
    }

    async function loadInflationData() {
      try {
        const response = await fetch('data/SAInflation.csv');
        const text = await response.text();
        const parsed = Papa.parse(text, {
          header: true,
          dynamicTyping: true,
          skipEmptyLines: true
        });

        inflationHistory = parsed.data
          .filter(row => row.observation_date && row.FPCPITOTLZGZAF != null)
          .map(row => ({
            time: row.observation_date.substring(0, 4),
            inflation: parseFloat(row.FPCPITOTLZGZAF)
          }))
          .sort((a, b) => parseInt(a.time, 10) - parseInt(b.time, 10));

        if (inflationHistory.length > 0) {
          const latest = inflationHistory[inflationHistory.length - 1];
          document.getElementById('current-inflation').innerHTML =
            `In ${latest.time}: <strong>${latest.inflation.toFixed(2)}%</strong>`;
        }
      } catch (e) {
        document.getElementById('current-inflation').innerHTML =
          `<span class="text-danger">Error loading SAInflation.csv — Check file path and column names</span>`;
        console.error(e);
      }
    }

    function renderInflationChart(years) {
      let filtered = inflationHistory;
      if (years < 9999) {
        filtered = inflationHistory.slice(-years);
      }

      if (inflationChart) {
        inflationChart.data.labels = filtered.map(h => h.time);
        inflationChart.data.datasets[0].data = filtered.map(h => h.inflation);
        inflationChart.update();
      } else {
        inflationChart = new Chart(document.getElementById('inflationChart'), {
          type: 'line',
          data: {
            labels: filtered.map(h => h.time),
            datasets: [{
              label: 'Inflation Rate (%)',
              data: filtered.map(h => h.inflation),
              borderColor: '#FFCD00',
              backgroundColor: 'rgba(255, 205, 0, 0.1)',
              borderWidth: 3,
              tension: 0.2,
              pointRadius: 1.5
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: context => `${context.raw.toFixed(2)}%`
                }
              }
            },
            scales: {
              y: {
                title: { display: true, text: 'Inflation Rate (%)' },
                ticks: {
                  callback: value => `${value.toFixed(1)}%`
                }
              }
            }
          }
        });
      }
    }

    function setInflationTimeframe(years, button) {
      document.querySelectorAll('.inflation-btn-group button').forEach(b => b.classList.remove('active'));
      if (button) button.classList.add('active');
      renderInflationChart(years);
    }

    function setTimeframe(days, button) {
      let filtered = rateHistory;
      if (days < 9999) {
        filtered = rateHistory.slice(-days);
      }

      if (zarChart) {
        zarChart.data.labels = filtered.map(h => h.time);
        zarChart.data.datasets[0].data = filtered.map(h => h.rate);
        zarChart.update();
      } else {
        zarChart = new Chart(document.getElementById('zarChart'), {
          type: 'line',
          data: {
            labels: filtered.map(h => h.time),
            datasets: [{
              label: 'USD/ZAR',
              data: filtered.map(h => h.rate),
              borderColor: '#007A4D',
              backgroundColor: 'rgba(0, 122, 77, 0.1)',
              borderWidth: 3,
              tension: 0.2,
              pointRadius: 1.5
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              y: {
                title: { display: true, text: 'ZAR per 1 USD' }
              }
            }
          }
        });
      }
    }

    function renderGdpChart(years) {
      let filtered = gdpHistory;
      if (years < 9999) {
        filtered = gdpHistory.slice(-years);
      }

      if (gdpChart) {
        gdpChart.data.labels = filtered.map(h => h.time);
        gdpChart.data.datasets[0].data = filtered.map(h => h.gdp);
        gdpChart.update();
      } else {
        gdpChart = new Chart(document.getElementById('gdpChart'), {
          type: 'line',
          data: {
            labels: filtered.map(h => h.time),
            datasets: [{
              label: 'GDP (current US$)',
              data: filtered.map(h => h.gdp),
              borderColor: '#002395',
              backgroundColor: 'rgba(0, 35, 149, 0.1)',
              borderWidth: 3,
              tension: 0.2,
              pointRadius: 1.5
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: context => `$${context.raw.toLocaleString(undefined, {maximumFractionDigits: 0})}`
                }
              }
            },
            scales: {
              y: {
                title: { display: true, text: 'GDP in current US$' },
                ticks: {
                  callback: value => `$${Number(value).toLocaleString()}`
                }
              }
            }
          }
        });
      }
    }

    function setTimeframe(days, button) {
      document.querySelectorAll('.currency-btn-group button').forEach(b => b.classList.remove('active'));
      if (button) button.classList.add('active');
      renderChart(days);
    }

    function setGdpTimeframe(years, button) {
      document.querySelectorAll('.gdp-btn-group button').forEach(b => b.classList.remove('active'));
      if (button) button.classList.add('active');
      renderGdpChart(years);
    }

    function renderChart(days) {
      let filtered = rateHistory;
      if (days < 9999) {
        filtered = rateHistory.slice(-days);
      }

      if (zarChart) {
        zarChart.data.labels = filtered.map(h => h.time);
        zarChart.data.datasets[0].data = filtered.map(h => h.rate);
        zarChart.update();
      } else {
        zarChart = new Chart(document.getElementById('zarChart'), {
          type: 'line',
          data: {
            labels: filtered.map(h => h.time),
            datasets: [{
              label: 'USD/ZAR',
              data: filtered.map(h => h.rate),
              borderColor: '#007A4D',
              backgroundColor: 'rgba(0, 122, 77, 0.1)',
              borderWidth: 3,
              tension: 0.2,
              pointRadius: 1.5
            }]
          },
          options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
              y: {
                title: { display: true, text: 'ZAR per 1 USD' }
              }
            }
          }
        });
      }
    }

    function renderGdpChart(years) {
      let filtered = gdpHistory;
      if (years < 9999) {
        filtered = gdpHistory.slice(-years);
      }

      if (gdpChart) {
        gdpChart.data.labels = filtered.map(h => h.time);
        gdpChart.data.datasets[0].data = filtered.map(h => h.gdp);
        gdpChart.update();
      } else {
        gdpChart = new Chart(document.getElementById('gdpChart'), {
          type: 'line',
          data: {
            labels: filtered.map(h => h.time),
            datasets: [{
              label: 'GDP (current US$)',
              data: filtered.map(h => h.gdp),
              borderColor: '#002395',
              backgroundColor: 'rgba(0, 35, 149, 0.1)',
              borderWidth: 3,
              tension: 0.2,
              pointRadius: 1.5
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: context => `$${context.raw.toLocaleString(undefined, {maximumFractionDigits: 0})}`
                }
              }
            },
            scales: {
              y: {
                title: { display: true, text: 'GDP in current US$' },
                ticks: {
                  callback: value => `$${Number(value).toLocaleString()}`
                }
              }
            }
          }
        });
      }
    }

    function setTimeframe(days, button) {
      document.querySelectorAll('.currency-btn-group button').forEach(b => b.classList.remove('active'));
      if (button) button.classList.add('active');
      renderChart(days);
    }

    window.onload = loadCSVData;
  </script>
</body>
</html>
