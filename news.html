<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News • South Africa Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(to right, #007A4D, #FFCD00, #002395);">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">🇿🇦 South Africa Dashboard</a>
      <a href="index.html" class="btn btn-light btn-sm">← Back to Dashboard</a>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="display-5 fw-bold text-sa-green">📰 Africa News Brief</h1>
      <div class="d-flex align-items-center gap-3">
        <button onclick="loadNews()" class="btn btn-success btn-lg">🔄 Refresh</button>
        <span id="last-updated" class="text-muted small"></span>
      </div>
    </div>

    <div class="row mb-5">
      <div class="col-lg-7">
        <div id="ai-summary" class="alert alert-light border-success shadow-sm h-100">
          <h5 class="text-sa-green mb-3">🔍 Morning Brief</h5>
          <div id="summary-content" class="small"></div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h6 class="text-sa-green mb-3">Sources & Filters</h6>
            <div id="category-pills" class="mb-3"></div>
            <div id="sources-list" class="mb-3"></div>

            <div class="mb-3">
              <label class="form-label small">Keywords</label>
              <input id="keyword-input" type="text" class="form-control form-control-sm" placeholder="ramaphosa, eskom, mining, load shedding">
            </div>

            <div class="row align-items-end">
              <div class="col-6">
                <label class="form-label small">Stories</label>
                <input id="story-count" type="number" class="form-control form-control-sm" value="20" min="8" max="60">
              </div>
              <div class="col-6">
                <button onclick="loadNews()" class="btn btn-outline-success w-100">Apply</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <h3 class="mb-3 text-sa-green">🔥 Top Headlines</h3>
    <div id="news-container" class="list-group"></div>
  </div>

  <script>
    const availableSources = [
      { name: "Reuters Africa", url: "https://www.reuters.com/world/africa/rss", categories: ["Africa", "Global"] },
      { name: "Bloomberg Africa", url: "https://www.bloomberg.com/feeds/site/africa.xml", categories: ["Africa", "Global"] },
      { name: "BBC Africa", url: "https://feeds.bbci.co.uk/news/world/africa/rss.xml", categories: ["Africa", "Global"] },
      { name: "Africanews", url: "https://www.africanews.com/feed/rss", categories: ["Africa", "Global"] },
      { name: "CNBC Africa", url: "https://www.cnbcafrica.com/feed/", categories: ["Africa", "Energy", "Global"] },
      { name: "Al Jazeera English", url: "https://www.aljazeera.com/xml/rss/all.xml", categories: ["Global", "Africa"] },
      { name: "FT Global", url: "https://www.ft.com/?format=rss", categories: ["Global", "Finance"] },
      { name: "The Economist - World News", url: "https://www.economist.com/world-this-week/rss.xml", categories: ["Global", "Finance"] },
      { name: "Business Day", url: "https://www.businesslive.co.za/rss/", categories: ["South Africa", "Finance", "Energy"] },
      { name: "Moneyweb", url: "https://www.moneyweb.co.za/feed/", categories: ["South Africa", "Finance"] },
      { name: "TimesLIVE", url: "https://www.timeslive.co.za/rss/", categories: ["South Africa", "General"] },
      { name: "News24", url: "http://feeds.news24.com/articles/news24/SouthAfrica/rss", categories: ["South Africa", "General"] },
      { name: "eNCA", url: "https://www.enca.com/rss", categories: ["South Africa", "General"] },
      { name: "The Citizen", url: "https://citizen.co.za/feed/", categories: ["South Africa", "General"] },
      { name: "BusinessLIVE", url: "https://www.businesslive.co.za/rss/", categories: ["South Africa", "Finance", "Energy"] },
      { name: "France 24", url: "https://www.france24.com/en/rss", categories: ["Global", "Africa"] }
    ];

    const categoryOptions = ["All", "Africa", "Africa Energy", "South Africa", "Global"];
    let selectedCategory = "Africa";
    let selectedSources = ["Reuters Africa", "Bloomberg Africa", "BBC Africa", "Africanews", "CNBC Africa", "Al Jazeera English"];

    function formatDate(dateString) {
      if (!dateString) return "";
      const dt = new Date(dateString);
      return dt.toLocaleString('en-ZA', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function buildTeaser(item) {
      const description = (item.description || item.contentSnippet || "").replace(/<[^>]*>/g, '');
      const firstSentence = description.split('. ')[0] || '';
      if (firstSentence.length > 120) return firstSentence.slice(0, 117) + '...';
      return firstSentence || item.title;
    }

    function calculateImportanceScore(item) {
      const text = (item.title + ' ' + (item.description || '')).toLowerCase();
      const ageHours = (Date.now() - new Date(item.pubDate)) / (1000 * 60 * 60);
      let score = Math.max(0, 120 - ageHours * 3);
      if (["Reuters", "Bloomberg", "BBC", "FT", "Economist", "CNBC", "Al Jazeera"].some(name => item.source.includes(name))) score += 45;
      if (item.source.includes('Africa') || item.source.includes('South Africa')) score += 25;
      const highImpact = ["eskom", "load shedding", "electricity", "power", "ramaphosa", "coal", "renewable", "mining", "pgm", "gold", "corruption", "strike", "energy", "politics", "court", "government", "inflation", "debt", "investment"];
      highImpact.forEach(keyword => { if (text.includes(keyword)) score += 12; });
      const lowImpact = ["celebrity", "match", "entertainment", "festival", "recipe", "birthday", "viral", "lifestyle"];
      lowImpact.forEach(keyword => { if (text.includes(keyword)) score -= 40; });
      return Math.max(0, score);
    }

    function getCategoryButtonClass(cat) {
      return selectedCategory === cat ? 'btn-success' : 'btn-outline-secondary';
    }

    function renderCategoryPills() {
      const container = document.getElementById('category-pills');
      container.innerHTML = categoryOptions.map(cat => `
        <button type="button" class="btn ${getCategoryButtonClass(cat)} btn-sm me-2 mb-2" onclick="setCategory('${cat}')">${cat}</button>
      `).join('');
    }

    function renderSourceCheckboxes() {
      const container = document.getElementById('sources-list');
      let html = '';
      availableSources.forEach(src => {
        if (selectedCategory !== 'All' && !src.categories.some(c => c === selectedCategory || (selectedCategory === 'Africa Energy' && c === 'Energy'))) return;
        const checked = selectedSources.includes(src.name) ? 'checked' : '';
        html += `
          <div class="form-check form-check-inline me-2 mb-2">
            <input class="form-check-input" type="checkbox" id="src-${src.name}" value="${src.name}" ${checked} onchange="toggleSource('${src.name}')">
            <label class="form-check-label small" for="src-${src.name}">${src.name}</label>
          </div>`;
      });
      if (!html) html = '<div class="text-muted small">No sources available for this category.</div>';
      container.innerHTML = html;
    }

    function setCategory(category) {
      selectedCategory = category;
      renderCategoryPills();
      renderSourceCheckboxes();
    }

    window.toggleSource = function(name) {
      if (selectedSources.includes(name)) {
        selectedSources = selectedSources.filter(src => src !== name);
      } else {
        selectedSources.push(name);
      }
    };

    function buildSummary(items) {
      const titles = items.map(item => item.title.toLowerCase()).join(' ');
      const bullets = [];
      if (/(eskom|load shedding|electricity|power|grid)/.test(titles)) bullets.push('Energy supply and Eskom remain the dominant risk for South Africa’s morning briefing.');
      if (/(ramaphosa|government|parliament|coalition|election|politic)/.test(titles)) bullets.push('Politics and governing stability are under close watch, especially ANC and coalition developments.');
      if (/(mining|gold|pgm|chrome|manganese|vanadium|iron ore)/.test(titles)) bullets.push('Mining and commodity flows are the key economic themes, with export risk and market momentum top of mind.');
      if (/(inflation|debt|rating|investment|economy|finance|bank)/.test(titles)) bullets.push('Macro and finance stories are shaping investor sentiment for the region.');
      if (bullets.length === 0) bullets.push('Focus is on the most important Africa and South Africa stories across energy, markets and politics.');
      return bullets.map(line => `<p class="mb-1">• ${line}</p>`).join('');
    }

    async function loadNews() {
      const container = document.getElementById('news-container');
      const summaryEl = document.getElementById('summary-content');
      const lastUpdatedEl = document.getElementById('last-updated');
      container.innerHTML = '<div class="list-group-item text-center py-5"><div class="spinner-border text-success"></div><div class="mt-3">Loading and ranking top Africa headlines…</div></div>';

      try {
        const keywordText = document.getElementById('keyword-input').value.toLowerCase();
        const keywords = keywordText.split(',').map(k => k.trim()).filter(Boolean);
        const storyCount = parseInt(document.getElementById('story-count').value, 10) || 20;

        let allItems = [];
        for (const source of availableSources) {
          if (!selectedSources.includes(source.name)) continue;
          try {
            const proxy = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.url)}`;
            const response = await fetch(proxy);
            const data = await response.json();
            if (data && data.items) {
              data.items.forEach(item => { item.source = source.name; allItems.push(item); });
            }
          } catch (error) {
            console.warn('Failed source', source.name, error);
          }
        }

        if (allItems.length === 0) {
          container.innerHTML = '<div class="list-group-item text-center py-5">No stories loaded yet. Try a different source selection or refresh.</div>';
          summaryEl.innerHTML = '';
          return;
        }

        allItems = allItems.map(item => ({ ...item, importanceScore: calculateImportanceScore(item) }));
        allItems.sort((a, b) => b.importanceScore - a.importanceScore);

        if (keywords.length > 0) {
          allItems = allItems.filter(item => {
            const text = (item.title + ' ' + (item.description || '')).toLowerCase();
            return keywords.some(kw => text.includes(kw));
          });
        }

        const topItems = allItems.slice(0, storyCount);
        summaryEl.innerHTML = buildSummary(topItems);

        const html = topItems.map(item => {
          const teaser = buildTeaser(item);
          const date = formatDate(item.pubDate);
          return `
            <a href="${item.link}" target="_blank" class="list-group-item list-group-item-action border-0 py-3" style="border-bottom:1px solid rgba(0,0,0,0.05);">
              <div class="d-flex justify-content-between align-items-start">
                <div>
                  <strong>${item.title}</strong>
                  <div class="small text-muted">${item.source}</div>
                </div>
                <small class="text-muted text-end">${date}</small>
              </div>
              <p class="mb-0 mt-2 text-truncate text-muted">${teaser}</p>
            </a>`;
        }).join('');

        container.innerHTML = html || '<div class="list-group-item text-center py-5">No stories matched your filters.</div>';
        lastUpdatedEl.textContent = `Updated ${new Date().toLocaleTimeString('en-ZA')}`;
      } catch (error) {
        container.innerHTML = '<div class="list-group-item text-center py-5 text-danger">Unable to refresh news. Please try again.</div>';
        summaryEl.innerHTML = '';
      }
    }

    window.onload = function() {
      renderCategoryPills();
      renderSourceCheckboxes();
      loadNews();
    };
  </script>

  <style>
    .list-group-item-action:hover { background: rgba(13,110,253,0.04); }
    .text-truncate { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</body>
</html>
