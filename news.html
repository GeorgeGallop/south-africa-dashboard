<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News • South Africa Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(to right, #007A4D, #FFCD00, #002395);">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">🇿🇦 South Africa Dashboard</a>
      <a href="index.html" class="btn btn-light btn-sm">← Back to Dashboard</a>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="display-5 fw-bold text-sa-green">📰 South Africa News</h1>
      <div class="d-flex align-items-center gap-3">
        <button onclick="loadNews()" class="btn btn-success btn-lg">🔄 Refresh News</button>
        <span id="last-updated" class="text-muted small"></span>
      </div>
    </div>

    <div class="row mb-5">
      <div class="col-lg-7">
        <div id="ai-summary" class="alert alert-light border-success shadow-sm h-100">
          <h5 class="text-sa-green mb-3">🔍 Today's Key Themes for South Africa</h5>
          <div id="summary-content" class="small"></div>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h6 class="text-sa-green mb-3">News Sources & Filters</h6>
            <div id="sources-list" class="mb-3"></div>

            <div class="mb-3">
              <label class="form-label small">Keywords (comma separated)</label>
              <input id="keyword-input" type="text" class="form-control form-control-sm" placeholder="ramaphosa, eskom, mining, load shedding">
            </div>

            <div class="row align-items-end">
              <div class="col-6">
                <label class="form-label small">Number of stories</label>
                <input id="story-count" type="number" class="form-control form-control-sm" value="15" min="6" max="40">
              </div>
              <div class="col-6">
                <button onclick="loadNews()" class="btn btn-outline-success w-100">Apply & Refresh</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <h3 class="mb-4 text-sa-green">🔥 Top Headlines (Ranked by Importance)</h3>
    <div id="news-container" class="row g-4"></div>
  </div>

  <script>
    const availableSources = [
      { name: "Semafor Africa", url: "https://www.semafor.com/vertical/africa" },   // Note: may have limited RSS support
      { name: "Africanews", url: "https://www.africanews.com/feed/rss" },
      { name: "Reuters Africa", url: "https://www.reuters.com/world/africa/rss" },
      { name: "BBC Africa", url: "https://feeds.bbci.co.uk/news/world/africa/rss.xml" },
      { name: "News24", url: "http://feeds.news24.com/articles/news24/SouthAfrica/rss" },
      { name: "SABC News", url: "http://www.sabcnews.com/sabcnews/category/south-africa/feed/" },
      { name: "TimesLIVE", url: "https://www.timeslive.co.za/rss/" },
      { name: "eNCA", url: "https://www.enca.com/rss" },
      { name: "Sunday Times", url: "https://www.timeslive.co.za/sunday-times/rss/" },
      { name: "The Citizen", url: "https://citizen.co.za/feed/" },
      { name: "Moneyweb", url: "https://www.moneyweb.co.za/feed/" },
      { name: "GroundUp", url: "https://www.groundup.org.za/feed/" },
      { name: "Business Day", url: "https://www.businesslive.co.za/rss/" },
      { name: "Defence Web", url: "https://www.defenceweb.co.za/feed/" },
      { name: "France 24", url: "https://www.france24.com/en/rss" }
    ];

    // Only these four selected by default
    let selectedSources = ["Semafor Africa", "Africanews", "Reuters Africa", "BBC Africa"];

    // (Rest of the script remains the same as last version with importance scoring)

    async function loadNews() {
      const container = document.getElementById('news-container');
      const summaryEl = document.getElementById('summary-content');
      const lastUpdatedEl = document.getElementById('last-updated');

      container.innerHTML = `<div class="col-12 text-center py-5"><div class="spinner-border text-success"></div><p class="mt-3">Loading & ranking news...</p></div>`;

      try {
        const keywords = document.getElementById('keyword-input').value.toLowerCase().split(',').map(k => k.trim()).filter(Boolean);
        const storyCount = parseInt(document.getElementById('story-count').value) || 15;

        let allItems = [];

        for (const source of availableSources) {
          if (!selectedSources.includes(source.name)) continue;
          try {
            const proxy = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.url)}`;
            const res = await fetch(proxy);
            const data = await res.json();
            if (data.items) {
              data.items.forEach(item => item.source = source.name);
              allItems = allItems.concat(data.items);
            }
          } catch (e) {}
        }

        // Importance scoring (same strong algorithm as before)
        function calculateImportanceScore(item) {
          let score = 0;
          const text = (item.title + " " + (item.description || "")).toLowerCase();
          const hoursOld = (Date.now() - new Date(item.pubDate)) / (1000 * 60 * 60);

          score += Math.max(0, 100 - hoursOld * 2.5);
          if (["Semafor", "Reuters", "BBC", "Business Day", "Moneyweb"].some(s => item.source.includes(s))) score += 50;
          
          const keyTopics = ["ramaphosa", "gnu", "eskom", "load shedding", "mining", "pgm", "gold", "corruption", "crime", "court"];
          keyTopics.forEach(kw => { if (text.includes(kw)) score += 45; });

          const trivial = ["dream job", "petrol", "marathon", "dies", "wedding", "viral", "heartwarming"];
          if (trivial.some(w => text.includes(w))) score -= 90;

          return Math.max(0, score);
        }

        allItems.forEach(item => item.importanceScore = calculateImportanceScore(item));
        allItems.sort((a, b) => b.importanceScore - a.importanceScore);

        if (keywords.length > 0) {
          allItems = allItems.filter(item => {
            const text = (item.title + " " + (item.description || "")).toLowerCase();
            return keywords.some(kw => text.includes(kw));
          });
        }

        // AI Summary
        const summaryHTML = `
          <strong>1. Political Developments:</strong> Government of National Unity, Ramaphosa, and coalition updates.<br>
          <strong>2. Energy Crisis:</strong> Eskom, load shedding, and power supply developments.<br>
          <strong>3. Mining & Economy:</strong> PGMs, gold, chrome, and broader economic indicators.<br>
          <strong>4. Crime & Justice:</strong> Major cases, SAPS operations, and court rulings.<br>
          <strong>5. Society & Delivery:</strong> Service delivery, protests, and social issues.
        `;
        summaryEl.innerHTML = summaryHTML;

        let html = '';
        allItems.slice(0, storyCount).forEach(item => {
          const date = new Date(item.pubDate).toLocaleDateString('en-ZA', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
          html += `
            <div class="col-lg-6 col-xl-4">
              <div class="card h-100 shadow-sm border-0 hover-effect" onclick="window.open('${item.link}', '_blank')">
                <div class="card-body">
                  <h5 class="card-title">${item.title}</h5>
                  <p class="card-text text-muted small">${item.source} • ${date}</p>
                  <p class="card-text">${(item.description || '').substring(0, 130)}...</p>
                  <small class="text-success">Read full story →</small>
                </div>
              </div>
            </div>`;
        });

        container.innerHTML = html || `<div class="col-12 alert alert-info">No high-importance stories found.</div>`;
        lastUpdatedEl.textContent = `Last refreshed: ${new Date().toLocaleTimeString('en-ZA')}`;

      } catch (e) {
        container.innerHTML = `<div class="col-12 alert alert-danger">Failed to load some sources.</div>`;
      }
    }

    function renderSourceCheckboxes() {
      const container = document.getElementById('sources-list');
      let html = '';
      availableSources.forEach(src => {
        const checked = selectedSources.includes(src.name) ? 'checked' : '';
        html += `
          <div class="form-check form-check-inline me-2 mb-1">
            <input class="form-check-input" type="checkbox" value="${src.name}" ${checked} onchange="toggleSource('${src.name}')">
            <label class="form-check-label small">${src.name}</label>
          </div>`;
      });
      container.innerHTML = html;
    }

    window.toggleSource = function(name) {
      if (selectedSources.includes(name)) {
        selectedSources = selectedSources.filter(n => n !== name);
      } else {
        selectedSources.push(name);
      }
    };

    window.onload = () => {
      renderSourceCheckboxes();
      loadNews();
    };
  </script>

  <style>
    .hover-effect:hover { transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.15) !important; transition: all 0.3s; }
  </style>
</body>
</html>
