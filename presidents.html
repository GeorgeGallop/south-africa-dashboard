<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post-Apartheid Presidents • South Africa Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(to right, #007A4D, #FFCD00, #002395);">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">🇿🇦 South Africa Dashboard</a>
      <a href="index.html" class="btn btn-light btn-sm">← Back to Dashboard</a>
    </div>
  </nav>

  <div class="container mt-4">
    <h1 class="display-5 fw-bold text-sa-green text-center mb-4">📜 Post-Apartheid Presidents of South Africa</h1>
    <p class="text-center lead mb-5">Since the end of apartheid in 1994</p>

    <div class="row g-4" id="presidents-grid"></div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="presidentModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-sa-green text-white">
          <h5 class="modal-title" id="modalName"></h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row">
            <div class="col-md-4 text-center">
              <img id="modalPhoto" class="img-fluid rounded shadow" style="max-height: 420px; object-fit: cover;" alt="">
            </div>
            <div class="col-md-8" id="modalContent"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const presidents = [
      {
        name: "Nelson Mandela",
        term: "1994 – 1999",
        photo: "images/presidents/presidents_nelson_mandela.jpg",
        para1: "Nelson Rolihlahla Mandela was South Africa’s first democratically elected president after apartheid.",
        para2: "Imprisoned for 27 years, he became the global symbol of reconciliation and led the transition to democracy.",
        para3: "He served only one term and received the Nobel Peace Prize in 1993.",
        sources: "Nelson Mandela Foundation"
      },
      {
        name: "Thabo Mbeki",
        term: "1999 – 2008",
        photo: "images/presidents/presidents_thabo_mbeki.jpg",
        para1: "Thabo Mbeki succeeded Mandela and promoted the African Renaissance.",
        para2: "His government expanded services and Black Economic Empowerment, but faced criticism over HIV/AIDS policy.",
        para3: "He was recalled by the ANC in 2008.",
        sources: "South African History Online"
      },
      {
        name: "Kgalema Motlanthe",
        term: "2008 – 2009",
        photo: "images/presidents/presidents_kgalema_motlanthe.jpg",
        para1: "Kgalema Motlanthe served as interim president for nine months.",
        para2: "Respected for his integrity, he ensured stability during the transition.",
        para3: "He later served as Deputy President.",
        sources: "South African Government"
      },
      {
        name: "Jacob Zuma",
        term: "2009 – 2018",
        photo: "images/presidents/presidents_jacob_zuma.jpg",
        para1: "Jacob Zuma expanded social grants but his presidency was marred by corruption scandals.",
        para2: "State capture and Nkandla controversies defined much of his term.",
        para3: "He resigned in 2018.",
        sources: "Zondo Commission"
      },
      {
        name: "Cyril Ramaphosa",
        term: "2018 – present",
        photo: "images/presidents/presidents_cyril_ramaphosa.jpg",
        para1: "Cyril Ramaphosa became president promising to fight corruption.",
        para2: "He leads the current Government of National Unity after the 2024 elections.",
        para3: "Focus remains on economic recovery and energy security.",
        sources: "South African Government"
      }
    ];

    function renderPresidents() {
      const grid = document.getElementById('presidents-grid');
      grid.innerHTML = presidents.map((p, i) => `
        <div class="col-md-6 col-lg-4">
          <div class="card h-100 shadow-sm" onclick="showPresident(${i})" style="cursor:pointer;">
            <img src="${p.photo}" class="card-img-top" style="height: 260px; object-fit: cover;" alt="${p.name}">
            <div class="card-body text-center">
              <h5 class="card-title text-sa-green">${p.name}</h5>
              <p class="card-text text-muted">${p.term}</p>
              <button class="btn btn-outline-success btn-sm w-100">View Profile</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    window.showPresident = function(i) {
      const p = presidents[i];
      document.getElementById('modalName').textContent = `${p.name} (${p.term})`;
      document.getElementById('modalPhoto').src = p.photo;
      
      document.getElementById('modalContent').innerHTML = `
        <p>${p.para1}</p>
        <p>${p.para2}</p>
        <p>${p.para3}</p>
        <hr>
        <strong>Source:</strong> ${p.sources}
      `;
      new bootstrap.Modal(document.getElementById('presidentModal')).show();
    };

    window.onload = renderPresidents;
  </script>

  <style>
    .card:hover { transform: scale(1.04); transition: 0.3s; }
  </style>
</body>
</html>
