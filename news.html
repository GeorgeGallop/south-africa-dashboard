<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News • South Africa Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(to right, #007A4D, #FFCD00, #002395);">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">🇿🇦 South Africa Dashboard</a>
      <div class="d-flex gap-2">
        <button onclick="history.back()" class="btn btn-light btn-sm">← Back</button>
        <a href="index.html" class="btn btn-light btn-sm">🏠 Home</a>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-3 px-xl-4 mt-3">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-3">
      <h1 class="display-5 fw-bold text-sa-green mb-0">📰 Africa News Brief</h1>
      <div class="d-flex align-items-center gap-3">
        <span id="last-updated" class="text-muted small"></span>
        <button onclick="loadNews()" class="btn btn-success btn-lg">🔄 Refresh</button>
      </div>
    </div>

    <!-- FILTERS BAR -->
    <div class="card shadow-sm mb-3">
      <div class="card-body py-2 px-3">
        <div class="row g-2 align-items-end">
          <div class="col-12 col-md">
            <small class="text-muted fw-bold d-block mb-1">Keywords (comma-separated)</small>
            <input id="keyword-input" type="text" class="form-control form-control-sm"
              placeholder="ramaphosa, eskom, mining, load shedding"
              onkeydown="if(event.key==='Enter') loadNews()">
          </div>
          <div class="col-6 col-md-auto" style="min-width:110px">
            <small class="text-muted fw-bold d-block mb-1">Stories</small>
            <input id="story-count" type="number" class="form-control form-control-sm" value="75" min="10" max="500" step="5">
          </div>
          <div class="col-6 col-md-auto d-flex align-items-end">
            <button onclick="loadNews()" class="btn btn-outline-success w-100">Apply</button>
          </div>
          <div class="col-6 col-md-auto d-flex align-items-end">
            <button onclick="clearFilters()" class="btn btn-outline-secondary w-100">Clear</button>
          </div>
        </div>
      </div>
    </div>

    <!-- SOURCES BAR -->
    <div class="card shadow-sm mb-3">
      <div class="card-body py-2 px-3">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
          <small class="text-muted fw-bold">Sources</small>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-dark btn-sm" onclick="selectAllSources()">Select All</button>
            <button class="btn btn-outline-secondary btn-sm" onclick="deselectAllSources()">Deselect All</button>
          </div>
        </div>
        <div id="sources-list" class="mt-2 d-flex flex-wrap gap-1"></div>
      </div>
    </div>

    <!-- STATUS BAR -->
    <div id="status-bar" class="mb-3" style="display:none;">
      <div class="d-flex flex-wrap align-items-center gap-3">
        <span id="story-count-display" class="badge bg-dark fs-6"></span>
        <span id="active-filters-display" class="text-muted small"></span>
        <span id="error-summary" class="text-danger small"></span>
      </div>
    </div>

    <!-- HEADLINE LIST -->
    <div id="summary-content">
      <div class="text-center py-5">
        <div class="spinner-border text-success"></div>
        <div class="mt-3">Loading top Africa headlines…</div>
      </div>
    </div>

  </div>

  <script>
    const FETCH_TIMEOUT_MS = 8000;

    const availableSources = [
      { name: "BBC Africa",        url: "https://feeds.bbci.co.uk/news/world/africa/rss.xml",    credibility: 5, status: "working" },
      { name: "Africanews",        url: "https://www.africanews.com/feed/rss",                    credibility: 4, status: "working" },
      { name: "Al Jazeera English",url: "https://www.aljazeera.com/xml/rss/all.xml",              credibility: 4, status: "working" },
      { name: "France 24",         url: "https://www.france24.com/en/rss",                        credibility: 4, status: "working" },
      { name: "CNBC Africa",       url: "https://www.cnbcafrica.com/feed/",                       credibility: 4, status: "failing", failReason: "rss2json HTTP 500" },
      { name: "Engineering News",  url: "https://www.engineeringnews.co.za/feed/",                 credibility: 4, status: "failing", failReason: "rss2json HTTP 500" },
      { name: "Business Day",      url: "https://www.businesslive.co.za/rss/",                     credibility: 4, status: "failing", failReason: "rss2json HTTP 500" },
      { name: "eNCA",              url: "https://www.enca.com/rss",                               credibility: 3, status: "failing", failReason: "rss2json HTTP 500" },
      { name: "Reuters Africa",    url: "https://www.reuters.com/world/africa/", type: "reuters-html", credibility: 5, status: "failing", failReason: "CORS proxy down. No open RSS." },
      { name: "Bloomberg Africa",  url: "https://www.bloomberg.com/feeds/site/africa.xml",        credibility: 5, status: "failing", failReason: "Paywalled RSS" },
      { name: "FT Global",         url: "https://www.ft.com/?format=rss",                        credibility: 5, status: "failing", failReason: "Paywalled RSS" },
      { name: "The Economist",     url: "https://www.economist.com/world-this-week/rss.xml",      credibility: 5, status: "failing", failReason: "Paywalled RSS" },
      { name: "News24",            url: "http://feeds.news24.com/articles/news24/SouthAfrica/rss", credibility: 3, status: "failing", failReason: "HTTP blocked by browser" },
      { name: "X Search",          url: "https://twitrss.me/twitter_search_to_rss/?term=%28africa%20OR%20South%20Africa%29%20%28energy%20OR%20gas%20OR%20LNG%20OR%20oil%20OR%20policy%20OR%20power%20OR%20economy%20OR%20eskom%29", credibility: 3, status: "failing", failReason: "twitrss.me down" },
      { name: "Semafor",           url: "https://www.semafor.com/vertical/africa", type: "semafor", credibility: 4, status: "failing", failReason: "CORS proxy down. No RSS." }
    ];

    let selectedSources = availableSources.map(s => s.name);

    // ---- HELPERS ----

    function formatDate(dateString) {
      if (!dateString) return "";
      const dt = new Date(dateString);
      if (isNaN(dt.getTime())) return "";
      return dt.toLocaleString('en-ZA', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function calculateImportanceScore(item) {
      const text = (item.title + ' ' + (item.description || '')).toLowerCase();
      const ageHours = (Date.now() - new Date(item.pubDate)) / (1000 * 60 * 60);
      let score = Math.max(0, 120 - ageHours * 3);
      const source = availableSources.find(src => src.name === item.source);
      if (source) score += source.credibility * 10;
      if (/\b(africa|south africa|energy|eskom|load shedding|ramaphosa|mining|commodities|inflation|debt|power|electricity|renewable|hydrogen|investor|rating|policy)\b/.test(text)) score += 20;
      if (/\b(celebrity|match|entertainment|festival|recipe|birthday|viral|sports|movie)\b/.test(text)) score -= 35;
      return Math.max(0, score);
    }

    function sanitizeId(value) {
      return value.replace(/[^a-zA-Z0-9_-]/g, '-');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ---- SOURCE CHECKBOXES ----

    function renderSourceCheckboxes() {
      const container = document.getElementById('sources-list');
      let html = '';
      availableSources.forEach(src => {
        const checked = selectedSources.includes(src.name) ? 'checked' : '';
        const safeId = sanitizeId(src.name);
        const badgeClass = src.status === 'failing' ? 'source-badge-failing' : 'source-badge-working';
        const statusLabel = src.status === 'failing' ? '⚠️' : '✅';
        const titleAttr = src.failReason ? ` title="${escapeHtml(src.failReason)}"` : '';

        html += `<div class="form-check form-check-inline source-chip ${badgeClass} me-1 mb-1"${titleAttr}>
          <input class="form-check-input" type="checkbox" id="src-${safeId}" value="${src.name}" ${checked} onchange="toggleSource('${escapeHtml(src.name)}')">
          <label class="form-check-label small" for="src-${safeId}">${statusLabel} ${src.name} <span class="badge bg-dark text-white">${src.credibility}</span></label>
        </div>`;
      });
      container.innerHTML = html;
    }

    window.toggleSource = function(name) {
      if (selectedSources.includes(name)) {
        selectedSources = selectedSources.filter(s => s !== name);
      } else {
        selectedSources.push(name);
      }
    };

    window.selectAllSources = function() {
      selectedSources = availableSources.map(s => s.name);
      renderSourceCheckboxes();
    };

    window.deselectAllSources = function() {
      selectedSources = [];
      renderSourceCheckboxes();
    };

    window.clearFilters = function() {
      document.getElementById('keyword-input').value = '';
      document.getElementById('story-count').value = '75';
      loadNews();
    };

    // ---- DISPLAY ----

    function truncateTitleForLine(title, metaText) {
      if (!title) return title;
      const raw = title.trim().replace(/\s+/g, ' ');
      const maxTotal = 130;
      const reserved = Math.min(metaText.length + 3, 60);
      const allowed = Math.max(30, maxTotal - reserved);
      if (raw.length <= allowed) return raw;
      const words = raw.split(' ');
      let shortened = '';
      for (const word of words) {
        if ((shortened + (shortened ? ' ' : '') + word).length > allowed) break;
        shortened += (shortened ? ' ' : '') + word;
      }
      return shortened || raw.slice(0, allowed);
    }

    function buildNewsList(items) {
      if (items.length === 0) {
        return '<div class="text-center py-5 text-muted">No stories match your filters.</div>';
      }
      const links = items.map(item => {
        const date = formatDate(item.pubDate);
        const sourceName = item.source || '';
        const metaText = `${sourceName} · ${date}`;
        const titleText = truncateTitleForLine(item.title, metaText);
        return `<a href="${item.link}" target="_blank" rel="noopener" class="headline-link"><span class="headline-title">${escapeHtml(titleText)}</span><span class="headline-meta">${metaText}</span></a>`;
      }).join('');
      return `<div class="headline-list">${links}</div>`;
    }

    // ---- FETCHING ----

    async function fetchTextWithTimeout(url, timeoutMs) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const r = await fetch(url, { signal: controller.signal });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return await r.text();
      } finally { clearTimeout(t); }
    }

    async function fetchJsonWithTimeout(url, timeoutMs) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const r = await fetch(url, { signal: controller.signal });
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        return await r.json();
      } finally { clearTimeout(t); }
    }

    async function fetchReutersHtmlArticles(source, perSourceFetchCount) {
      const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(source.url)}`;
      const html = await fetchTextWithTimeout(proxy, FETCH_TIMEOUT_MS);
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const items = [];
      const seen = new Set();
      const cards = doc.querySelectorAll('div[data-testid*="card"], article, [class*="StoryCard"], [class*="story-card"], .media-story-card');
      for (const card of cards) {
        if (items.length >= perSourceFetchCount) break;
        const link = card.querySelector('a[href*="/world/africa/"]') || card.querySelector('a[href*="/article/"]');
        if (!link) continue;
        let href = link.getAttribute('href');
        if (!href) continue;
        const normalized = href.startsWith('http') ? href : `https://www.reuters.com${href}`;
        if (seen.has(normalized)) continue;
        seen.add(normalized);
        let title = '';
        const h = card.querySelector('h2, h3, h1, [data-testid*="headline"]');
        if (h) title = h.textContent.trim();
        if (!title) title = (link.getAttribute('aria-label') || link.textContent || '').trim();
        if (!title || title.length < 15) continue;
        let desc = '';
        const p = card.querySelector('p');
        if (p) desc = p.textContent.trim();
        let pubDate = '';
        const time = card.querySelector('time');
        if (time) pubDate = time.getAttribute('datetime') || time.textContent.trim();
        if (!pubDate) pubDate = new Date().toISOString();
        items.push({ title, link: normalized, pubDate, description: desc, source: source.name });
      }
      return items.slice(0, perSourceFetchCount);
    }

    async function fetchSemaforArticles(source, perSourceFetchCount) {
      const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(source.url)}`;
      const html = await fetchTextWithTimeout(proxy, FETCH_TIMEOUT_MS);
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const anchors = Array.from(doc.querySelectorAll('a[href*="/article/"]'));
      const items = [];
      const seen = new Set();
      anchors.forEach(anchor => {
        const href = anchor.getAttribute('href');
        if (!href) return;
        const normalized = href.startsWith('http') ? href : `https://www.semafor.com${href}`;
        if (seen.has(normalized)) return;
        seen.add(normalized);
        let title = (anchor.textContent || '').trim().replace(/^\s*[0-9]+[\.\)\-:\s]*/, '').replace(/\s+/g, ' ');
        if (!title) return;
        let desc = '';
        const summary = anchor.querySelector('p');
        if (summary) desc = summary.textContent.trim();
        let pubDate = '';
        const time = anchor.querySelector('time') || anchor.closest('article')?.querySelector('time');
        if (time) pubDate = time.getAttribute('datetime') || time.textContent.trim();
        if (!pubDate) pubDate = new Date().toISOString();
        items.push({ title, link: normalized, pubDate, description: desc, source: source.name });
      });
      return items.slice(0, perSourceFetchCount);
    }

    // ---- MAIN LOAD ----

    async function loadNews() {
      const summaryEl = document.getElementById('summary-content');
      const lastUpdatedEl = document.getElementById('last-updated');
      const statusBar = document.getElementById('status-bar');
      const storyCountDisplay = document.getElementById('story-count-display');
      const activeFiltersDisplay = document.getElementById('active-filters-display');
      const errorSummary = document.getElementById('error-summary');

      summaryEl.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-success"></div><div class="mt-3">Loading top Africa headlines…</div></div>';
      statusBar.style.display = 'none';

      let loadingTimer = window.setTimeout(() => {
        summaryEl.innerHTML = '<div class="alert alert-light border-warning shadow-sm text-center"><strong>Still loading…</strong><div class="small text-muted">Some sources may be rate-limited.</div></div>';
      }, 6000);

      try {
        const keywordText = document.getElementById('keyword-input').value.trim();
        const rawStoryCount = parseInt(document.getElementById('story-count').value, 10);
        const requestedCount = Number.isInteger(rawStoryCount) && rawStoryCount >= 10 ? rawStoryCount : 75;
        const perSourceFetchCount = 100;

        let allItems = [];
        let totalFetched = 0;
        let errorsBySource = {};
        let countsBySource = {};

        const selected = availableSources.filter(s => selectedSources.includes(s.name));

        if (selected.length === 0) {
          window.clearTimeout(loadingTimer);
          summaryEl.innerHTML = '<div class="alert alert-warning text-center">No sources selected. Check at least one source above.</div>';
          return;
        }

        const fetchPromises = selected.map(async (source) => {
          try {
            let data;
            if (source.type === 'semafor') {
              data = await fetchSemaforArticles(source, perSourceFetchCount);
            } else if (source.type === 'reuters-html') {
              data = await fetchReutersHtmlArticles(source, perSourceFetchCount);
            } else {
              const proxy = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.url)}`;
              const json = await fetchJsonWithTimeout(proxy, FETCH_TIMEOUT_MS);
              data = json.items ? json.items.slice(0, perSourceFetchCount) : [];
            }
            const count = Array.isArray(data) ? data.length : 0;
            return { sourceName: source.name, items: Array.isArray(data) ? data : [], count, error: null };
          } catch (error) {
            console.warn(`[${source.name}] ${error.message}`);
            return { sourceName: source.name, items: [], count: 0, error: error.message || 'Unknown error' };
          }
        });

        const results = await Promise.all(fetchPromises);

        results.forEach(result => {
          countsBySource[result.sourceName] = result.count;
          if (result.error) errorsBySource[result.sourceName] = result.error;
          totalFetched += result.count;
          result.items.forEach(item => {
            item.source = result.sourceName;
            allItems.push(item);
          });
        });

        // ---- DEDUPLICATE ----
        const deduped = [];
        const seenTitles = new Set();
        for (const item of allItems) {
          const normalized = item.title.toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 80);
          if (seenTitles.has(normalized)) continue;
          seenTitles.add(normalized);
          deduped.push(item);
        }
        allItems = deduped;

        // ---- KEYWORD FILTERING (searches title + description + content) ----
        const keywords = keywordText.toLowerCase().split(/[,;\s]+/).map(k => k.trim()).filter(Boolean);
        let keywordFilteredCount = 0;
        if (keywords.length > 0) {
          const before = allItems.length;
          allItems = allItems.filter(item => {
            const text = [item.title, item.description, item.content].filter(Boolean).join(' ').toLowerCase();
            return keywords.some(kw => text.includes(kw));
          });
          keywordFilteredCount = before - allItems.length;
        }

        // ---- SCORE & SORT ----
        allItems = allItems.map(item => ({ ...item, importanceScore: calculateImportanceScore(item) }));
        allItems.sort((a, b) => b.importanceScore - a.importanceScore);

        // ---- STORY COUNT: show whichever is smaller, requested or available ----
        const showCount = Math.min(requestedCount, allItems.length);
        const topItems = allItems.slice(0, showCount);

        // ---- RENDER ----
        summaryEl.innerHTML = buildNewsList(topItems);
        window.clearTimeout(loadingTimer);

        // ---- STATUS BAR ----
        statusBar.style.display = 'block';
        storyCountDisplay.textContent = `Showing ${topItems.length} stories (${allItems.length} after filter, ${totalFetched} fetched)`;

        const filterParts = [];
        if (keywords.length > 0) filterParts.push(`Keywords: ${keywords.join(', ')}`);
        activeFiltersDisplay.textContent = filterParts.length ? `🔍 ${filterParts.join(' | ')}` : '';

        const errorSources = Object.keys(errorsBySource);
        if (errorSources.length > 0) {
          errorSummary.innerHTML = `⚠️ Failed: ${errorSources.map(s => `${s} (${errorsBySource[s]})`).join('; ')}`;
        } else {
          errorSummary.innerHTML = '';
        }

        updateSourceLiveCounts(countsBySource, errorsBySource);
        lastUpdatedEl.textContent = `Updated ${new Date().toLocaleTimeString('en-ZA')}`;

      } catch (error) {
        window.clearTimeout(loadingTimer);
        console.error(error);
        summaryEl.innerHTML = '<div class="text-center py-5 text-danger"><strong>Failed to load news.</strong><br><small>Check console for details.</small><br><button class="btn btn-outline-danger btn-sm mt-3" onclick="loadNews()">Retry</button></div>';
      }
    }

    function updateSourceLiveCounts(countsBySource, errorsBySource) {
      availableSources.forEach(src => {
        const safeId = sanitizeId(src.name);
        const label = document.querySelector(`label[for="src-${safeId}"]`);
        if (!label) return;
        const existing = label.querySelector('.live-count');
        if (existing) existing.remove();
        const count = countsBySource[src.name];
        const err = errorsBySource[src.name];
        let html = '';
        if (err) {
          html = ` <span class="live-count text-danger small">(❌)</span>`;
        } else if (count !== undefined && count >= 0) {
          html = ` <span class="live-count text-success small">(${count})</span>`;
        }
        label.insertAdjacentHTML('beforeend', html);
      });
    }

    window.onload = function() {
      renderSourceCheckboxes();
      loadNews();
    };
  </script>

  <style>
    .container-fluid { max-width: 100%; }

    .source-chip {
      padding: 2px 8px; border-radius: 20px; background: #f1f3f5;
      border: 1px solid #dee2e6; cursor: pointer; transition: all 0.15s ease; font-size: 0.82rem;
    }
    .source-chip:hover { background: #e9ecef; }
    .source-badge-failing { background: #fff3cd; border-color: #ffc107; }
    .source-badge-working { background: #d1e7dd; border-color: #198754; }
    .source-chip .form-check-input { margin-top: 0.15rem; margin-right: 0.25rem; }
    .source-chip .form-check-label { cursor: pointer; }

    .headline-list { border-top: 2px solid #212529; }
    .headline-link {
      display: flex; flex-wrap: nowrap; align-items: baseline; font-size: 0.92rem;
      line-height: 1.3; padding: 8px 4px; text-decoration: none; color: #212529;
      border-bottom: 1px solid #dee2e6; overflow: hidden; white-space: nowrap; transition: background 0.1s;
    }
    .headline-link:hover { background: #f8f9fa; color: #007A4D; }
    .headline-title { display: inline-block; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .headline-meta { flex-shrink: 0; color: #6c757d; font-size: 0.78rem; font-weight: 400; margin-left: 0.75rem; white-space: nowrap; }

    @media (max-width: 768px) {
      .headline-link { font-size: 0.84rem; }
      .headline-meta { font-size: 0.72rem; margin-left: 0.4rem; }
      .source-chip { font-size: 0.75rem; }
    }
  </style>
</body>
</html>
