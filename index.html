<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>South Africa Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(to right, #007A4D, #FFCD00, #002395);">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">🇿🇦 South Africa Dashboard</a>
    </div>
  </nav>

  <div class="container-fluid mt-4">
    <div class="row">
      <!-- Hierarchical Sidebar -->
<!-- Sidebar -->
      <div class="col-md-3">
        <div class="list-group">
          <a href="power.html"      class="list-group-item list-group-item-action">⚡ Power</a>
          <a href="mining.html"     class="list-group-item list-group-item-action">⛏️ Mining</a>
          <a href="economy.html"    class="list-group-item list-group-item-action">📈 Economy</a>
          <a href="politics.html"   class="list-group-item list-group-item-action">🏛️ Politics</a>
          
          <!-- History with sub-section -->
          <div class="list-group-item">
            <a href="#" class="d-flex justify-content-between align-items-center text-decoration-none text-sa-green"
              data-bs-toggle="collapse" data-bs-target="#historySub">
              📜 History <span class="badge bg-secondary">▼</span>
            </a>
            <div class="collapse mt-2" id="historySub">
              <div class="list-group ms-3">
                <a href="presidents.html" class="list-group-item list-group-item-action small">→ Presidents</a>
              </div>
            </div>
          </div>

          <!-- New: News section -->
          <a href="news.html" class="list-group-item list-group-item-action">📰 News</a>
        </div>
      </div>

      <!-- Main Content Area -->
      <div class="col-md-9">
        <div class="text-center py-5">
          <h1 class="display-4 fw-bold text-success">Welcome to South Africa</h1>
          <p class="lead">Navigate using the sidebar. Main sections open full pages.<br>
             Sub-sections appear under their parent (like Presidents under History).</p>
          <img src="https://flagcdn.com/w640/za.png" alt="South Africa Flag" style="max-height: 220px; margin-top: 30px;">
        </div>
      </div>
    </div>
  </div>
</body>
</html>
