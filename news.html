<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News • South Africa Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(to right, #007A4D, #FFCD00, #002395);">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="index.html">🇿🇦 South Africa Dashboard</a>
      <div class="d-flex gap-2">
        <button onclick="history.back()" class="btn btn-light btn-sm">← Back</button>
        <a href="index.html" class="btn btn-light btn-sm">🏠 Home</a>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3 flex-column flex-md-row gap-3">
      <div>
        <h1 class="display-5 fw-bold text-sa-green">📰 Africa News Brief</h1>
      </div>
      <div class="d-flex align-items-center gap-3">
        <button onclick="loadNews()" class="btn btn-success btn-lg">🔄 Refresh</button>
        <span id="last-updated" class="text-muted small"></span>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-lg-8">
        <div id="ai-summary" class="alert alert-light border-success shadow-sm h-100">
          <h5 class="text-sa-green mb-3">🔍 Top story snapshot</h5>
          <div id="summary-content" class="small"></div>
        </div>
      </div>
      <div class="col-lg-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h6 class="text-sa-green mb-3">Sources & filters</h6>
            <div id="category-pills" class="mb-3"></div>
            <div id="sources-list" class="mb-3"></div>

            <div class="mb-3">
              <label class="form-label small">Keywords</label>
              <input id="keyword-input" type="text" class="form-control form-control-sm" placeholder="ramaphosa, eskom, mining, load shedding" onkeydown="if(event.key==='Enter') loadNews()">
            </div>

            <div class="row align-items-end">
              <div class="col-6">
                <label class="form-label small">Stories</label>
                <input id="story-count" type="number" class="form-control form-control-sm" value="75" min="75" max="200">
              </div>
              <div class="col-6">
                <button onclick="loadNews()" class="btn btn-outline-success w-100">Apply</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const FETCH_TIMEOUT_MS = 8000;

    const availableSources = [
      { 
        name: "Reuters Africa", 
        type: "reuters-html",
        url: "https://www.reuters.com/world/africa/",
        categories: ["Africa", "Africa Energy", "Africa Politics", "Africa Economy", "Global"], 
        credibility: 5, 
        bias: "neutral" 
      },
      { name: "Bloomberg Africa", url: "https://www.bloomberg.com/feeds/site/africa.xml", categories: ["Africa", "Africa Energy", "Africa Economy", "Global"], credibility: 5, bias: "neutral" },
      { name: "BBC Africa", url: "https://feeds.bbci.co.uk/news/world/africa/rss.xml", categories: ["Africa", "Africa Politics", "Africa Economy", "Global"], credibility: 5, bias: "neutral" },
      { name: "Africanews", url: "https://www.africanews.com/feed/rss", categories: ["Africa", "Africa Politics", "Africa Economy", "Global"], credibility: 4, bias: "centrist" },
      { name: "CNBC Africa", url: "https://www.cnbcafrica.com/feed/", categories: ["Africa", "Africa Energy", "Africa Economy", "Global"], credibility: 4, bias: "business" },
      { name: "Al Jazeera English", url: "https://www.aljazeera.com/xml/rss/all.xml", categories: ["Global", "Africa", "Africa Politics"], credibility: 4, bias: "center-left" },
      { name: "FT Global", url: "https://www.ft.com/?format=rss", categories: ["Global", "Africa Economy"], credibility: 5, bias: "business" },
      { name: "The Economist - World News", url: "https://www.economist.com/world-this-week/rss.xml", categories: ["Global", "Africa Economy"], credibility: 5, bias: "business" },
      { name: "Business Day", url: "https://www.businesslive.co.za/rss/", categories: ["South Africa", "Africa Economy", "Africa Energy", "Africa Politics"], credibility: 4, bias: "business" },
      { name: "Engineering News", url: "https://www.engineeringnews.co.za/feed/", categories: ["South Africa", "Africa Energy", "Africa Economy"], credibility: 4, bias: "industry" },
      { name: "Moneyweb", url: "https://www.moneyweb.co.za/feed/", categories: ["South Africa", "Africa Economy"], credibility: 3, bias: "business" },
      { name: "News24", url: "http://feeds.news24.com/articles/news24/SouthAfrica/rss", categories: ["South Africa", "Africa Politics"], credibility: 3, bias: "general" },
      { name: "eNCA", url: "https://www.enca.com/rss", categories: ["South Africa", "Africa Politics"], credibility: 3, bias: "general" },
      { name: "The Citizen", url: "https://citizen.co.za/feed/", categories: ["South Africa", "Africa Politics", "Africa Economy"], credibility: 3, bias: "general" },
      { name: "France 24", url: "https://www.france24.com/en/rss", categories: ["Global", "Africa", "Africa Politics"], credibility: 4, bias: "international" },
      { name: "X Search", url: "https://twitrss.me/twitter_search_to_rss/?term=%28africa%20OR%20South%20Africa%29%20%28energy%20OR%20gas%20OR%20LNG%20OR%20oil%20OR%20policy%20OR%20power%20OR%20economy%20OR%20eskom%29", categories: ["Africa", "Africa Energy", "Africa Politics", "Africa Economy", "Global"], credibility: 3, bias: "social" },
      { name: "Semafor", type: "semafor", url: "https://www.semafor.com/vertical/africa", actor: "parseforge~semafor-articles-scraper", section: "africa", categories: ["Africa", "Africa Politics", "Africa Economy", "Global"], credibility: 4, bias: "news" }
    ];

    const categoryOptions = ["All", "Africa", "Africa Energy", "Africa Politics", "Africa Economy", "South Africa", "Global"];
    let selectedCategory = "Africa";
    let selectedSources = ["Reuters Africa", "Bloomberg Africa", "BBC Africa", "Africanews", "CNBC Africa", "Al Jazeera English", "Business Day", "Engineering News", "X Search", "Semafor"];

    function formatDate(dateString) {
      if (!dateString) return "";
      const dt = new Date(dateString);
      return dt.toLocaleString('en-ZA', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function calculateImportanceScore(item) {
      const text = (item.title + ' ' + (item.description || '')).toLowerCase();
      const ageHours = (Date.now() - new Date(item.pubDate)) / (1000 * 60 * 60);
      let score = Math.max(0, 120 - ageHours * 3);
      const source = availableSources.find(src => src.name === item.source);
      if (source) score += source.credibility * 10;
      if (/\b(africa|south africa|energy|eskom|load shedding|ramaphosa|mining|commodities|inflation|debt|power|electricity|renewable|hydrogen|investor|rating|policy)\b/.test(text)) score += 20;
      if (/\b(celebrity|match|entertainment|festival|recipe|birthday|viral|sports|movie)\b/.test(text)) score -= 35;
      return Math.max(0, score);
    }

    function categorizeStory(item) {
      const text = (item.title + ' ' + (item.description || '')).toLowerCase();
      if (/\b(power|electricity|eskom|gas|renewable|solar|wind|hydro|energy|oil|lpg|lignite|coal|pipeline|lng|fsru|regas|fuel)\b/i.test(text)) return 'Africa Energy';
      if (/\b(election|parliament|government|ramaphosa|anc|da|coalition|corruption|court|politics|policy|ministry|cabinet|vote|regulator|strike)\b/i.test(text)) return 'Africa Politics';
      if (/\b(inflation|economic|growth|GDP|debt|investment|market|finance|rand|export|import|commodity|mining|bank|rating|trade|budget|reserve bank)\b/i.test(text)) return 'Africa Economy';
      if (/\b(south africa|africa|continent|regional|african)\b/i.test(text)) return 'Africa';
      return 'Global';
    }

    function normalizeSemaforTitle(title) {
      if (!title) return title;
      let cleaned = title.trim();
      cleaned = cleaned.replace(/^\s*[0-9]+[\.\)\-:\s]*/, '');
      cleaned = cleaned.replace(/\s+/g, ' ');
      return cleaned;
    }

    function getSourceDisplayName(sourceName) {
      if (!sourceName) return sourceName;
      if (sourceName.toLowerCase().includes('semafor')) return 'Semafor';
      return sourceName;
    }

    function truncateTitleForLine(title, metaText) {
      if (!title) return title;
      const raw = title.trim().replace(/\s+/g, ' ');
      const maxTotal = 130;
      const reserved = Math.min(metaText.length + 3, 60);
      const allowed = Math.max(30, maxTotal - reserved);
      if (raw.length <= allowed) return raw;
      const words = raw.split(' ');
      let shortened = '';
      for (const word of words) {
        if ((shortened + (shortened ? ' ' : '') + word).length > allowed) break;
        shortened += (shortened ? ' ' : '') + word;
      }
      return shortened || raw.slice(0, allowed);
    }

    function getCategoryButtonClass(cat) {
      return selectedCategory === cat ? 'btn-success' : 'btn-outline-secondary';
    }

    function sanitizeId(value) {
      return value.replace(/[^a-zA-Z0-9_-]/g, '-');
    }

    function renderCategoryPills() {
      const container = document.getElementById('category-pills');
      container.innerHTML = categoryOptions.map(cat => `
        <button type="button" class="btn ${getCategoryButtonClass(cat)} btn-sm me-2 mb-2" onclick="setCategory('${cat}')">${cat}</button>
      `).join('');
    }

    function renderSourceCheckboxes() {
      const container = document.getElementById('sources-list');
      let html = '';
      availableSources.forEach(src => {
        if (selectedCategory !== 'All' && !src.categories.includes(selectedCategory)) return;
        const checked = selectedSources.includes(src.name) ? 'checked' : '';
        const safeId = sanitizeId(src.name);
        html += `
          <div class="form-check form-check-inline me-2 mb-2">
            <input class="form-check-input" type="checkbox" id="src-${safeId}" value="${src.name}" ${checked} onchange="toggleSource('${src.name}')">
            <label class="form-check-label small" for="src-${safeId}">${src.name} <span class="badge bg-dark text-white">${src.credibility}</span></label>
          </div>`;
      });
      if (!html) html = '<div class="text-muted small">No sources available for this category.</div>';
      container.innerHTML = html;
    }

    function setCategory(category) {
      selectedCategory = category;
      renderCategoryPills();
      renderSourceCheckboxes();
    }

    window.toggleSource = function(name) {
      if (selectedSources.includes(name)) {
        selectedSources = selectedSources.filter(src => src !== name);
      } else {
        selectedSources.push(name);
      }
    };

    function buildSummary(items) {
      const links = items.map(item => {
        const date = formatDate(item.pubDate);
        const displaySource = getSourceDisplayName(item.source);
        const metaText = `| ${displaySource} | ${date}`;
        const titleText = truncateTitleForLine(item.title, metaText);
        return `<a href="${item.link}" target="_blank" class="summary-link"><span class="summary-title">${titleText}</span><span class="summary-meta">${metaText}</span></a>`;
      }).join('');

      return `<div class="summary-links">${links}</div>`;
    }

    async function fetchTextWithTimeout(url, timeoutMs) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.text();
      } finally {
        clearTimeout(t);
      }
    }

    async function fetchJsonWithTimeout(url, timeoutMs) {
      const controller = new AbortController();
      const t = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return await response.json();
      } finally {
        clearTimeout(t);
      }
    }

    // ==================== IMPROVED REUTERS SCRAPER ====================
    async function fetchReutersHtmlArticles(source, perSourceFetchCount) {
      const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(source.url)}`;
      const html = await fetchTextWithTimeout(proxy, FETCH_TIMEOUT_MS);
      const doc = new DOMParser().parseFromString(html, 'text/html');

      const items = [];
      const seen = new Set();

      // Target Reuters article cards more reliably
      const cards = doc.querySelectorAll(
        'div[data-testid*="card"], article, [class*="StoryCard"], [class*="story-card"], .media-story-card'
      );

      for (const card of cards) {
        if (items.length >= perSourceFetchCount) break;

        // Find link inside the card that points to an Africa story
        const link = card.querySelector('a[href*="/world/africa/"]') || card.querySelector('a[href*="/article/"]');
        if (!link) continue;

        let href = link.getAttribute('href');
        if (!href) continue;

        const normalizedHref = href.startsWith('http') ? href : `https://www.reuters.com${href}`;
        if (seen.has(normalizedHref)) continue;
        seen.add(normalizedHref);

        // Get title from heading inside card or from link
        let title = '';
        const heading = card.querySelector('h2, h3, h1, [data-testid*="headline"]');
        if (heading) title = heading.textContent.trim();
        if (!title) title = (link.getAttribute('aria-label') || link.textContent || '').trim();

        if (!title || title.length < 15) continue;

        // Get description
        let description = '';
        const descEl = card.querySelector('p');
        if (descEl) description = descEl.textContent.trim();

        // Get date
        let pubDate = '';
        const timeEl = card.querySelector('time');
        if (timeEl) pubDate = timeEl.getAttribute('datetime') || timeEl.textContent.trim();
        if (!pubDate) pubDate = new Date().toISOString();

        items.push({
          title,
          link: normalizedHref,
          pubDate,
          description,
          source: source.name,
          category: categorizeStory({ title, description })
        });
      }

      console.log(`[Reuters Africa] Found ${items.length} articles`); // helpful for debugging
      return items.slice(0, perSourceFetchCount);
    }

    async function fetchSemaforArticles(source, perSourceFetchCount) {
      const proxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(source.url)}`;
      const html = await fetchTextWithTimeout(proxy, FETCH_TIMEOUT_MS);
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const anchors = Array.from(doc.querySelectorAll('a[href*="/article/"]'));
      const items = [];
      const seen = new Set();

      anchors.forEach(anchor => {
        const href = anchor.getAttribute('href');
        if (!href) return;
        const normalizedHref = href.startsWith('http') ? href : `https://www.semafor.com${href}`;
        if (seen.has(normalizedHref)) return;
        seen.add(normalizedHref);

        let title = anchor.textContent || '';
        title = title.trim();
        if (!title) {
          const heading = anchor.querySelector('h1, h2, h3, h4');
          title = heading ? heading.textContent.trim() : '';
        }
        title = normalizeSemaforTitle(title);
        if (!title) return;

        let description = '';
        const summary = anchor.querySelector('p');
        if (summary) description = summary.textContent.trim();

        let pubDate = '';
        const timeEl = anchor.querySelector('time') || anchor.closest('article')?.querySelector('time');
        if (timeEl) pubDate = timeEl.getAttribute('datetime') || timeEl.textContent.trim();
        if (!pubDate) pubDate = new Date().toISOString();

        items.push({
          title,
          link: normalizedHref,
          pubDate,
          description,
          source: source.name,
          category: categorizeStory({ title, description })
        });
      });

      return items.slice(0, perSourceFetchCount);
    }

    async function loadNews() {
      const summaryEl = document.getElementById('summary-content');
      const lastUpdatedEl = document.getElementById('last-updated');
      summaryEl.innerHTML = '<div class="text-center py-5"><div class="spinner-border text-success"></div><div class="mt-3">Loading top Africa headlines…</div></div>';

      let loadingTimer = window.setTimeout(() => {
        summaryEl.innerHTML = '<div class="alert alert-light border-warning shadow-sm"><strong>Still loading…</strong><div class="small text-muted">Some sources may be rate-limited.</div></div>';
      }, 4000);

      try {
        const keywordText = document.getElementById('keyword-input').value.trim();
        const rawStoryCount = parseInt(document.getElementById('story-count').value, 10);
        const storyCount = Number.isInteger(rawStoryCount) && rawStoryCount >= 75 ? rawStoryCount : 75;
        const perSourceFetchCount = 200;

        let allItems = [];
        let totalFetched = 0;
        let fetchBySource = {};
        let errorsBySource = {};

        const selected = availableSources.filter(source => selectedSources.includes(source.name));
        const fetchPromises = selected.map(async (source) => {
          try {
            let data;
            if (source.type === 'semafor') {
              data = await fetchSemaforArticles(source, perSourceFetchCount);
            } else if (source.type === 'reuters-html') {
              data = await fetchReutersHtmlArticles(source, perSourceFetchCount);
            } else {
              const proxy = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(source.url)}`;
              const json = await fetchJsonWithTimeout(proxy, FETCH_TIMEOUT_MS);
              data = json.items ? json.items.slice(0, perSourceFetchCount) : [];
            }

            const count = Array.isArray(data) ? data.length : 0;
            return { sourceName: source.name, items: Array.isArray(data) ? data : [], count, error: null };
          } catch (error) {
            console.error(`[${source.name}] Error:`, error.message);
            return { sourceName: source.name, items: [], count: 0, error: error.message || 'Unknown error' };
          }
        });

        const results = await Promise.all(fetchPromises);

        results.forEach(result => {
          fetchBySource[result.sourceName] = result.count;
          if (result.error) errorsBySource[result.sourceName] = result.error;
          totalFetched += result.count;

          result.items.forEach(item => {
            item.source = result.sourceName;
            item.category = item.category || categorizeStory(item);
            allItems.push(item);
          });
        });

        if (allItems.length === 0) {
          window.clearTimeout(loadingTimer);
          summaryEl.innerHTML = `
            <div class="alert alert-warning">
              No stories could be loaded.
              ${Object.keys(errorsBySource).length ? `<div class="mt-2 small text-danger"><strong>Errors:</strong> ${Object.keys(errorsBySource).join(', ')}</div>` : ''}
            </div>`;
          return;
        }

        // Keyword filtering
        const keywords = keywordText.toLowerCase().split(/[\s,]+/).map(k => k.trim()).filter(Boolean);
        if (keywords.length > 0) {
          allItems = allItems.filter(item => {
            const text = [item.title, item.description, item.contentSnippet].filter(Boolean).join(' ').toLowerCase();
            return keywords.some(kw => text.includes(kw));
          });
        }

        allItems = allItems.map(item => ({ ...item, importanceScore: calculateImportanceScore(item) }));
        allItems.sort((a, b) => b.importanceScore - a.importanceScore);

        const topItems = allItems.slice(0, storyCount);

        summaryEl.innerHTML = `
          <div class="mb-3 text-muted small">
            <strong>Loaded:</strong> ${totalFetched} stories • Showing ${topItems.length} top stories<br>
            ${Object.entries(errorsBySource).length ? `<strong class="text-danger">Errors: ${Object.keys(errorsBySource).join(', ')}</strong>` : ''}
          </div>
          ${buildSummary(topItems)}
        `;
        window.clearTimeout(loadingTimer);
        lastUpdatedEl.textContent = `Updated ${new Date().toLocaleTimeString('en-ZA')}`;

      } catch (error) {
        window.clearTimeout(loadingTimer);
        console.error(error);
        summaryEl.innerHTML = '<div class="text-center py-5 text-danger">Failed to load news. Please try again.</div>';
      }
    }

    window.onload = function() {
      renderCategoryPills();
      renderSourceCheckboxes();
      loadNews();
    };
  </script>

  <style>
    .summary-link {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      font-size: 0.88rem;
      line-height: 1.2;
      margin-bottom: 0.15rem;
      text-decoration: none;
      color: #0d6efd;
      overflow: hidden;
      white-space: nowrap;
    }
    .summary-link:hover {
      text-decoration: underline;
    }
    .summary-title {
      display: inline-block;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .summary-meta {
      flex-shrink: 0;
      color: #6c757d;
      font-size: 0.78rem;
      margin-left: 0.5rem;
      white-space: nowrap;
    }
    #summary-content {
      max-height: 70vh;
      overflow-y: auto;
    }
  </style>
</body>
</html>
