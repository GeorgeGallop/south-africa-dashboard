<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map • South Africa Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Population density overlay -->
  <link rel="stylesheet" href="../css/population-density.css" />
  <style>
    /* The navbar is ~56px tall; size the map to the remaining viewport so
       the bottom-anchored Leaflet controls stay on screen. */
    #map { height: calc(100vh - 56px); width: 100%; }
    .sidebar { max-height: calc(100vh - 56px); overflow-y: auto; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(to right, #007A4D, #FFCD00, #002395);">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="../index.html">🇿🇦 South Africa Dashboard</a>
      <div class="d-flex gap-2">
        <button onclick="history.back()" class="btn btn-light btn-sm">← Back</button>
        <a href="../index.html" class="btn btn-light btn-sm">🏠 Home</a>
      </div>
    </div>
  </nav>

  <div class="row g-0">
    <!-- Map -->
    <div class="col-md-9 p-0">
      <div id="map"></div>
    </div>

    <!-- Saved Pins Sidebar -->
    <div class="col-md-3 bg-light border-start sidebar p-3">
      <h5 class="text-sa-green mb-2">Overlays</h5>
      <button type="button" id="pdToggleBtn" aria-pressed="false"
              class="btn btn-outline-success w-100 mb-2 d-flex align-items-center justify-content-center gap-2"
              onclick="togglePopulationDensity()">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
          <path d="M3 3h8v8H3V3zm10 0h8v8h-8V3zM3 13h8v8H3v-8zm10 0h8v8h-8v-8z"/>
        </svg>
        Population density
      </button>
      <p class="small text-muted mb-3">
        Number of people per square kilometre across South Africa's nine provinces.
      </p>
      <hr>
      <h5 class="text-sa-green mb-3">📍 Saved Locations</h5>
      <button onclick="addCurrentLocation()" class="btn btn-success w-100 mb-3">
        📌 Drop Pin at Current Center
      </button>
      <div id="pins-list" class="list-group"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../js/population-density.js"></script>
  <script>
    let map;
    let markers = [];
    let savedPins = JSON.parse(localStorage.getItem('saDashboardPins')) || [];

    function initMap() {
      // Cape Town coordinates
      // zoomSnap lets fitBounds use fractional zoom, so the population
      // density layer can frame South Africa tightly instead of being
      // rounded down a whole zoom level (which leaves wide grey margins).
      map = L.map('map', { zoomSnap: 0.25, zoomDelta: 0.5 })
        .setView([-33.925, 18.424], 12);

      const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(map);

      // Population-density overlay (toggleable layer + legend + opacity)
      POP_DENSITY.init(map, osmLayer);
      map.on('overlayadd', updatePopDensityButton);
      map.on('overlayremove', updatePopDensityButton);

      // Load saved pins
      loadSavedPins();

      // Click on map to add pin — suppressed while the density
      // overlay is on, so exploring the map does not pop a prompt.
      map.on('click', function(e) {
        if (POP_DENSITY.isEnabled()) return;
        const name = prompt("Name this location:", "New Location");
        if (name && name.trim() !== "") {
          addPin(e.latlng.lat, e.latlng.lng, name.trim());
        }
      });
    }

    function togglePopulationDensity() {
      if (POP_DENSITY.isEnabled()) {
        POP_DENSITY.disable();
      } else {
        POP_DENSITY.show();
      }
      updatePopDensityButton();
    }

    function updatePopDensityButton() {
      const btn = document.getElementById('pdToggleBtn');
      if (!btn) return;
      const on = POP_DENSITY.isEnabled();
      btn.classList.toggle('btn-success', on);
      btn.classList.toggle('btn-outline-success', !on);
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
    }

    function addPin(lat, lng, name) {
      const marker = L.marker([lat, lng]).addTo(map)
        .bindPopup(`<b>${name}</b><br>Lat: ${lat.toFixed(4)}<br>Lng: ${lng.toFixed(4)}`);

      const pin = { lat, lng, name, id: Date.now() };
      savedPins.push(pin);
      localStorage.setItem('saDashboardPins', JSON.stringify(savedPins));
      renderPinsList();
    }

    function loadSavedPins() {
      savedPins.forEach(pin => {
        const marker = L.marker([pin.lat, pin.lng]).addTo(map)
          .bindPopup(`<b>${pin.name}</b><br>Lat: ${pin.lat.toFixed(4)}<br>Lng: ${pin.lng.toFixed(4)}`);
        markers.push(marker);
      });
      renderPinsList();
    }

    function renderPinsList() {
      const container = document.getElementById('pins-list');
      container.innerHTML = '';

      savedPins.forEach((pin, index) => {
        const item = document.createElement('a');
        item.href = "#";
        item.className = "list-group-item list-group-item-action d-flex justify-content-between align-items-center";
        item.innerHTML = `
          <span><strong>${pin.name}</strong><br>
          <small class="text-muted">${pin.lat.toFixed(4)}, ${pin.lng.toFixed(4)}</small></span>
          <button onclick="deletePin(${index}); event.stopImmediatePropagation();" class="btn btn-sm btn-outline-danger">×</button>
        `;
        item.onclick = () => {
          map.flyTo([pin.lat, pin.lng], 15, { duration: 1.5 });
        };
        container.appendChild(item);
      });

      if (savedPins.length === 0) {
        container.innerHTML = `<div class="list-group-item text-muted">No saved locations yet.<br>Click on the map to add pins.</div>`;
      }
    }

    function deletePin(index) {
      if (confirm("Delete this location?")) {
        savedPins.splice(index, 1);
        localStorage.setItem('saDashboardPins', JSON.stringify(savedPins));
        // Refresh map markers
        map.eachLayer(layer => {
          if (layer instanceof L.Marker) map.removeLayer(layer);
        });
        loadSavedPins();
      }
    }

    function addCurrentLocation() {
      const center = map.getCenter();
      const name = prompt("Name this location:", "Current Center");
      if (name && name.trim() !== "") {
        addPin(center.lat, center.lng, name.trim());
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
